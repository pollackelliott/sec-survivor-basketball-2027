name: Update SEC Basketball Survivor scores

on:
  schedule:
    # Tuesday/Wednesday evenings (UTC), plus Saturday/Sunday window.
    - cron: '*/30 16-23 * * 2,3,6'
    - cron: '*/30 0-6 * * 3,4,0'
  workflow_dispatch:
    inputs:
      week:
        description: "Optional survivor week to sync"
        required: false
        default: ""
      all_games:
        description: "Inspect all season games (useful for preseason tipoff discovery)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sec-basketball-score-sync
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install requests

      - name: Sync ESPN metadata and results
        env:
          SUPABASE_URL: https://rlsxmkxwruuzimskvwrr.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          INPUT_WEEK: ${{ inputs.week }}
          INPUT_ALL: ${{ inputs.all_games }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [ -n "$INPUT_WEEK" ]; then
            args+=(--week "$INPUT_WEEK")
          fi
          if [ "$INPUT_ALL" = "true" ]; then
            args+=(--all)
          fi
          python scripts/update_scores.py "${args[@]}"
